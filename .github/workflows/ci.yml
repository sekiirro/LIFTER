name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Assert runtime Unicode pin
        run: |
          node -p process.versions.unicode
          npx vitest run tests/unit/password-policy-unicode-ranges.test.ts
      - name: Ensure edge build native tools work
        run: |
          # npm 11 may gate native install scripts. Rebuild only if the esbuild
          # or workerd binaries needed by build:edge fail their local checks.
          if ! node -e "require('esbuild').transformSync('const x = 1')" || ! npx --no-install workerd --version; then
            npm rebuild esbuild workerd
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:edge
      - run: npm run check:secrets
      - run: npm run build:cron
      - run: npm run size
      - run: npx playwright install --with-deps chromium

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LIFTER_SUPABASE_STACK: b
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Assert runtime Unicode pin
        run: |
          node -p process.versions.unicode
          npx vitest run tests/unit/password-policy-unicode-ranges.test.ts
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        # docker/login-action v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Prepare isolated Storage-enabled B profile
        run: |
          grep -qx 'project_id = "lifter-stack-b"' supabase-stack-b/supabase/config.toml
          ln -s "$GITHUB_WORKSPACE/supabase/migrations" supabase-stack-b/supabase/migrations
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
        working-directory: supabase-stack-b
      - name: Export local stack environment
        working-directory: supabase-stack-b
        run: supabase status -o env | sed -E 's/="(.*)"$/=\1/' >> "$GITHUB_ENV"
      - name: Export app server environment
        run: |
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "APP_ORIGIN=http://localhost:3000" >> "$GITHUB_ENV"
      - name: Provision local Vault signup keys
        run: node tests/integration/client-accounts-provision.mjs
      - name: Assert shared password policy DB parity
        run: npm run test:integration -- tests/integration/password-policy-parity.test.ts
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: Run full Playwright suite against the local stack
        run: npm run e2e -- --workers=1
        env:
          LOCAL_SUPABASE_STORAGE_TEST: 'true'
          LOCAL_SUPABASE_PROVIDER_FAULT_TEST: 'true'
      - run: supabase stop
        working-directory: supabase-stack-b
        if: always()
