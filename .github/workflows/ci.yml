name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.LIFTER_CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","lifter-wsl"]') || 'ubuntu-latest' }}
    env:
      LIFTER_CI_ISOLATED: ${{ vars.LIFTER_CI_RUNNER == 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: npm ci
      - name: Validate migration timestamps
        run: npm run check:migration-timestamps
      - name: Assert runtime Unicode pin
        run: |
          node -p process.versions.unicode
          npx vitest run tests/unit/password-policy-unicode-ranges.test.ts
      - name: Ensure edge build native tools work
        run: |
          # npm 11 may gate native install scripts. Rebuild only if the esbuild
          # or workerd binaries needed by build:edge fail their local checks.
          if ! node -e "require('esbuild').transformSync('const x = 1')" || ! npx --no-install workerd --version; then
            npm rebuild esbuild workerd
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:edge
      - run: npm run check:secrets
      - run: npm run build:cron
      - run: npm run size
      - run: |
          if [ "$LIFTER_CI_ISOLATED" = 'true' ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

  integration:
    runs-on: ${{ vars.LIFTER_CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","lifter-wsl"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      LIFTER_CI_ISOLATED: ${{ vars.LIFTER_CI_RUNNER == 'self-hosted' }}
      LIFTER_SUPABASE_STACK: ${{ vars.LIFTER_CI_RUNNER == 'self-hosted' && 'ci' || 'a' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Isolate self-hosted Supabase identity and ports
        if: env.LIFTER_CI_ISOLATED == 'true'
        run: node scripts/ci-supabase-config.mjs supabase/config.toml rewrite
      - name: Assert runtime Unicode pin
        run: |
          node -p process.versions.unicode
          npx vitest run tests/unit/password-policy-unicode-ranges.test.ts
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        # docker/login-action v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Clear prior self-hosted Supabase state and wait for ports
        if: env.LIFTER_CI_ISOLATED == 'true'
        run: |
          supabase stop --project-id lifter-stack-ci --no-backup
          node scripts/ci-supabase-config.mjs supabase/config.toml assert-clean
          node scripts/ci-supabase-config.mjs supabase/config.toml wait
      - run: supabase start -x studio,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - name: Export local stack environment
        run: supabase status -o env | sed -E 's/="(.*)"$/=\1/' >> "$GITHUB_ENV"
      - name: Export app server environment
        run: |
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "APP_ORIGIN=http://localhost:3000" >> "$GITHUB_ENV"
      - name: Provision local Vault signup keys
        run: node tests/integration/client-accounts-provision.mjs
      - name: Assert shared password policy DB parity
        run: npm run test:integration -- tests/integration/password-policy-parity.test.ts
      - run: npm run test:integration
      - run: |
          if [ "$LIFTER_CI_ISOLATED" = 'true' ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run full Playwright suite against the local stack
        run: npm run e2e -- --workers=1
        env:
          LOCAL_SUPABASE_STORAGE_TEST: 'true'
          LOCAL_SUPABASE_PROVIDER_FAULT_TEST: 'true'
      - run: |
          if [ "$LIFTER_CI_ISOLATED" = 'true' ]; then
            supabase stop --project-id lifter-stack-ci --no-backup
            node scripts/ci-supabase-config.mjs supabase/config.toml assert-clean
            node scripts/ci-supabase-config.mjs supabase/config.toml wait
          else
            supabase stop --no-backup
          fi
        if: always()

  storage:
    runs-on: ${{ vars.LIFTER_CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","lifter-wsl"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      LIFTER_CI_ISOLATED: ${{ vars.LIFTER_CI_RUNNER == 'self-hosted' }}
      LIFTER_SUPABASE_STACK: ${{ vars.LIFTER_CI_RUNNER == 'self-hosted' && 'ci' || 'a' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: npm ci
      - name: Isolate self-hosted Supabase identity and ports
        if: env.LIFTER_CI_ISOLATED == 'true'
        run: node scripts/ci-supabase-config.mjs supabase/config.toml rewrite
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        # docker/login-action v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Clear prior self-hosted Supabase state and wait for ports
        if: env.LIFTER_CI_ISOLATED == 'true'
        run: |
          supabase stop --project-id lifter-stack-ci --no-backup
          node scripts/ci-supabase-config.mjs supabase/config.toml assert-clean
          node scripts/ci-supabase-config.mjs supabase/config.toml wait
      - run: supabase start -x studio,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - name: Export local stack environment
        run: supabase status -o env | sed -E 's/="(.*)"$/=\1/' >> "$GITHUB_ENV"
      - name: Export app server environment
        run: |
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "APP_ORIGIN=http://localhost:3000" >> "$GITHUB_ENV"
      - name: Wait for Storage readiness
        run: node scripts/wait-storage-ready.mjs
      - name: Provision local Vault signup keys
        run: node tests/integration/client-accounts-provision.mjs
      - run: |
          if [ "$LIFTER_CI_ISOLATED" = 'true' ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run all F14 Storage integrations with zero skips
        run: |
          npm run test:integration -- \
            tests/integration/branding-banner-pipeline.test.ts \
            tests/integration/branding-owner-gc.test.ts \
            tests/integration/branding-proxy-resolution.test.ts \
            tests/integration/branding-storage-context.test.ts \
            tests/integration/branding-storage-policy.test.ts \
            tests/integration/branding-upload-recovery.test.ts \
            tests/integration/branding-validator.test.ts \
            --reporter=json --outputFile="$RUNNER_TEMP/branding-storage-integration.json"
          node scripts/assert-storage-suite-zero-skips.mjs integration "$RUNNER_TEMP/branding-storage-integration.json"
      - name: Run F14 banner and F11 pending-client Storage browser tests with zero skips
        shell: bash
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/branding-storage-playwright.json" \
            npm run e2e -- tests/e2e/branding-banner-loaded.spec.ts tests/e2e/branding-production-ui.spec.ts tests/e2e/client-accounts-storage.spec.ts --reporter=json --workers=1
          node scripts/assert-storage-suite-zero-skips.mjs playwright "$RUNNER_TEMP/branding-storage-playwright.json"
        env:
          LOCAL_SUPABASE_STORAGE_TEST: 'true'
      - run: |
          if [ "$LIFTER_CI_ISOLATED" = 'true' ]; then
            supabase stop --project-id lifter-stack-ci --no-backup
            node scripts/ci-supabase-config.mjs supabase/config.toml assert-clean
            node scripts/ci-supabase-config.mjs supabase/config.toml wait
          else
            supabase stop --no-backup
          fi
        if: always()
